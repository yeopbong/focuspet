[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "focuspet"
version = "0.1.0"
description = "A quiet local desktop companion for work rhythms"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
dependencies = [
  "PySide6==6.8.3", "numpy==2.2.4", "scikit-learn==1.6.1",
  "optuna==4.2.1", "pillow==11.1.0", "psutil==7.0.0",
  "pyobjc-framework-Cocoa==11.0; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz==11.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-qt==4.4.0", "ruff==0.11.2", "mypy==1.15.0", "pyinstaller==6.12.0", "build==1.2.2.post1"]

[project.scripts]
focuspet = "focuspet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
focuspet = ["assets/**/*", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = ["native: requires a visible macOS GUI", "soak: real duration longevity test"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

