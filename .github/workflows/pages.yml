name: Demo Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Export and verify static demo
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FOCUSPET_BROWSER_TESTS: '1'
      FOCUSPET_DEMO_DIRECTORY: .runtime/pages
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: .github/requirements-ci.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r .github/requirements-ci.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m playwright install --with-deps chromium
      - name: Export from the current Python core
        run: python -m focuspet.cli export-demo --scenario workday --output .runtime/pages
      - name: Verify resources and browser controls over HTTP
        run: python -m pytest tests/test_demo_export.py tests/browser -q
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .runtime/pages

  deploy:
    name: Publish Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
